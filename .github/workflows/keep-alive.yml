name: Keep Render backend warm

on:
  schedule:
    # Every 10 minutes — comfortably under Render's ~15 min free-tier
    # sleep threshold. GitHub's scheduler is best-effort and can drift
    # by a few minutes under load, so this leaves margin.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf https://full-stack-ecommerce-platform.onrender.com/api/health
